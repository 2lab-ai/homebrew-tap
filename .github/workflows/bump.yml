name: Bump formulae

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  bump-herdr-mx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render herdr-mx formula from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Latest non-prerelease; herdr-mx is preview-only until a stable
          # release is cut on request.
          TAG=$(gh release view --repo 2lab-ai/herdr-mx --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "no stable release yet; skipping herdr-mx formula"
            exit 0
          fi
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/herdr-mx.rb 2>/dev/null || true)
          if [ "${CURRENT:-}" = "$VERSION" ]; then
            echo "formula already at $VERSION"
            exit 0
          fi

          declare -A SHAS
          for asset in herdr-macos-aarch64 herdr-macos-x86_64 herdr-linux-aarch64 herdr-linux-x86_64; do
            gh release download "$TAG" --repo 2lab-ai/herdr-mx --pattern "$asset" --output "/tmp/$asset" --clobber
            SHAS[$asset]=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
          done

          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA_MACOS_AARCH64@/${SHAS[herdr-macos-aarch64]}/" \
              -e "s/@SHA_MACOS_X86_64@/${SHAS[herdr-macos-x86_64]}/" \
              -e "s/@SHA_LINUX_AARCH64@/${SHAS[herdr-linux-aarch64]}/" \
              -e "s/@SHA_LINUX_X86_64@/${SHAS[herdr-linux-x86_64]}/" \
              Formula/herdr-mx.rb.tmpl > Formula/herdr-mx.rb

          ruby -c Formula/herdr-mx.rb

      - name: Commit bump
        run: |
          set -euo pipefail
          # herdr-mx is preview-only until a stable release is cut: with every stable
          # release deleted the render step skips and the formula file may not exist at
          # all — that must not fail the job, or the preview bump (needs: this job)
          # never runs and the preview formula silently goes stale.
          [ -f Formula/herdr-mx.rb ] || { echo "no stable formula; nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/herdr-mx.rb
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          VERSION=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/herdr-mx.rb)
          git commit -m "herdr-mx $VERSION"
          git push

  bump-herdr-mx-preview:
    runs-on: ubuntu-latest
    needs: bump-herdr-mx
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Render herdr-mx-preview formula from the latest mx prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo 2lab-ai/herdr-mx --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("mx-preview-")))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$TAG" ]; then
            echo "no mx-preview prerelease yet"
            exit 0
          fi
          CURRENT=$(sed -n 's|^.*releases/download/\(mx-preview-[^/]*\)/.*$|\1|p' Formula/herdr-mx-preview.rb 2>/dev/null | head -1 || true)
          if [ "${CURRENT:-}" = "$TAG" ]; then
            echo "preview formula already at $TAG"
            exit 0
          fi
          # Derive the formula version from the TAG itself: time-stamped preview tags
          # (mx-preview-YYYY-MM-DD-HHMM-<sha>) carry the same YYYY.MM.DD.HHMM stamp the
          # binary reports in `herdr status` (`build:`), so brew and status can never
          # disagree about which build is installed. Legacy tags (no HHMM) fall back to
          # the release commit time, matching the old behaviour.
          if [[ "$TAG" =~ ^mx-preview-([0-9]{4})-([0-9]{2})-([0-9]{2})-([0-9]{4})-[0-9a-f]+$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
          else
            CREATED=$(gh release view "$TAG" --repo 2lab-ai/herdr-mx --json createdAt -q .createdAt)
            VERSION=$(date -u -d "$CREATED" +%Y.%m.%d.%H%M)
          fi

          declare -A SHAS
          for asset in herdr-macos-aarch64 herdr-macos-x86_64 herdr-linux-aarch64 herdr-linux-x86_64; do
            gh release download "$TAG" --repo 2lab-ai/herdr-mx --pattern "$asset" --output "/tmp/$asset" --clobber
            SHAS[$asset]=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
          done

          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@TAG@/$TAG/g" \
              -e "s/@SHA_MACOS_AARCH64@/${SHAS[herdr-macos-aarch64]}/" \
              -e "s/@SHA_MACOS_X86_64@/${SHAS[herdr-macos-x86_64]}/" \
              -e "s/@SHA_LINUX_AARCH64@/${SHAS[herdr-linux-aarch64]}/" \
              -e "s/@SHA_LINUX_X86_64@/${SHAS[herdr-linux-x86_64]}/" \
              Formula/herdr-mx-preview.rb.tmpl > Formula/herdr-mx-preview.rb

          ruby -c Formula/herdr-mx-preview.rb

      - name: Commit preview bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Commit BEFORE pulling: `git pull --rebase` refuses to run with the freshly
          # rendered formula sitting unstaged in the tree (this silently broke every
          # preview bump). Rebase the commit on top of anything the stable job pushed,
          # then push.
          git add Formula/herdr-mx-preview.rb 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          TAG=$(sed -n 's|^.*releases/download/\(mx-preview-[^/]*\)/.*$|\1|p' Formula/herdr-mx-preview.rb | head -1)
          git commit -m "herdr-mx-preview $TAG"
          git pull --rebase
          git push

  bump-llmux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render llmux formula from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo 2lab-ai/llmux --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "no stable release yet; skipping llmux formula"
            exit 0
          fi
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/llmux.rb 2>/dev/null || true)
          if [ "${CURRENT:-}" = "$VERSION" ]; then
            echo "formula already at $VERSION"
            exit 0
          fi

          declare -A SHAS
          for asset in llmux-macos-aarch64 llmux-macos-x86_64 llmux-linux-aarch64 llmux-linux-x86_64; do
            gh release download "$TAG" --repo 2lab-ai/llmux --pattern "$asset" --output "/tmp/$asset" --clobber
            SHAS[$asset]=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
          done

          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA_MACOS_AARCH64@/${SHAS[llmux-macos-aarch64]}/" \
              -e "s/@SHA_MACOS_X86_64@/${SHAS[llmux-macos-x86_64]}/" \
              -e "s/@SHA_LINUX_AARCH64@/${SHAS[llmux-linux-aarch64]}/" \
              -e "s/@SHA_LINUX_X86_64@/${SHAS[llmux-linux-x86_64]}/" \
              Formula/llmux.rb.tmpl > Formula/llmux.rb

          ruby -c Formula/llmux.rb

      - name: Commit bump
        run: |
          set -euo pipefail
          [ -f Formula/llmux.rb ] || { echo "no stable formula; nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/llmux.rb
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          VERSION=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/llmux.rb)
          git commit -m "llmux $VERSION"
          git pull --rebase
          git push

  bump-llmux-preview:
    runs-on: ubuntu-latest
    needs: bump-llmux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Render llmux-preview formula from the latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo 2lab-ai/llmux --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("preview-")))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$TAG" ]; then
            echo "no preview prerelease yet"
            exit 0
          fi
          CURRENT=$(sed -n 's|^.*releases/download/\(preview-[^/]*\)/.*$|\1|p' Formula/llmux-preview.rb 2>/dev/null | head -1 || true)
          if [ "${CURRENT:-}" = "$TAG" ]; then
            echo "preview formula already at $TAG"
            exit 0
          fi
          # preview-YYYY-MM-DD-HHMM-<sha> -> brew version YYYY.MM.DD.HHMM, matching
          # the LLMUX_BUILD_ID the binary reports in `llmux --version`.
          if [[ "$TAG" =~ ^preview-([0-9]{4})-([0-9]{2})-([0-9]{2})-([0-9]{4})-[0-9a-f]+$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
          else
            CREATED=$(gh release view "$TAG" --repo 2lab-ai/llmux --json createdAt -q .createdAt)
            VERSION=$(date -u -d "$CREATED" +%Y.%m.%d.%H%M)
          fi

          declare -A SHAS
          for asset in llmux-macos-aarch64 llmux-macos-x86_64 llmux-linux-aarch64 llmux-linux-x86_64; do
            gh release download "$TAG" --repo 2lab-ai/llmux --pattern "$asset" --output "/tmp/$asset" --clobber
            SHAS[$asset]=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
          done

          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@TAG@/$TAG/g" \
              -e "s/@SHA_MACOS_AARCH64@/${SHAS[llmux-macos-aarch64]}/" \
              -e "s/@SHA_MACOS_X86_64@/${SHAS[llmux-macos-x86_64]}/" \
              -e "s/@SHA_LINUX_AARCH64@/${SHAS[llmux-linux-aarch64]}/" \
              -e "s/@SHA_LINUX_X86_64@/${SHAS[llmux-linux-x86_64]}/" \
              Formula/llmux-preview.rb.tmpl > Formula/llmux-preview.rb

          ruby -c Formula/llmux-preview.rb

      - name: Commit preview bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/llmux-preview.rb 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          TAG=$(sed -n 's|^.*releases/download/\(preview-[^/]*\)/.*$|\1|p' Formula/llmux-preview.rb | head -1)
          git commit -m "llmux-preview $TAG"
          git pull --rebase
          git push

  bump-llmux-islands:
    runs-on: ubuntu-latest
    needs: bump-llmux
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Render llmux-islands cask from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The islands app rides the llmux stable release: the v* release that
          # ships the CLI binaries also carries LlmuxIslands-<version>.zip.
          TAG=$(gh release view --repo 2lab-ai/llmux --json tagName -q .tagName 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "no stable release yet; skipping llmux-islands cask"
            exit 0
          fi
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/llmux-islands.rb 2>/dev/null || true)
          if [ "${CURRENT:-}" = "$VERSION" ]; then
            echo "cask already at $VERSION"
            exit 0
          fi
          ASSET="LlmuxIslands-${VERSION}.zip"
          if ! gh release download "$TAG" --repo 2lab-ai/llmux --pattern "$ASSET" --output "/tmp/$ASSET" --clobber; then
            echo "release $TAG has no $ASSET yet; skipping cask bump"
            exit 0
          fi
          SHA=$(sha256sum "/tmp/$ASSET" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA@/$SHA/" \
              Casks/llmux-islands.rb.tmpl > Casks/llmux-islands.rb

          ruby -c Casks/llmux-islands.rb

      - name: Commit bump
        run: |
          set -euo pipefail
          [ -f Casks/llmux-islands.rb ] || { echo "no cask; nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/llmux-islands.rb
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          VERSION=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/llmux-islands.rb)
          git commit -m "llmux-islands $VERSION"
          git pull --rebase
          git push

  bump-llmux-islands-preview:
    runs-on: ubuntu-latest
    needs: bump-llmux-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Render llmux-islands-preview cask from the latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The islands app rides the llmux preview prerelease: the preview-*
          # prerelease that ships the CLI binaries also carries
          # LlmuxIslands-<version>.zip (built by preview.yml's `islands` job).
          TAG=$(gh release list --repo 2lab-ai/llmux --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("preview-")))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$TAG" ]; then
            echo "no preview prerelease yet"
            exit 0
          fi
          CURRENT=$(sed -n 's|^.*releases/download/\(preview-[^/]*\)/.*$|\1|p' Casks/llmux-islands-preview.rb 2>/dev/null | head -1 || true)
          if [ "${CURRENT:-}" = "$TAG" ]; then
            echo "islands preview cask already at $TAG"
            exit 0
          fi
          # preview-YYYY-MM-DD-HHMM-<sha> -> version YYYY.MM.DD.HHMM (matches the
          # LlmuxIslands-<version>.zip the islands job names).
          if [[ "$TAG" =~ ^preview-([0-9]{4})-([0-9]{2})-([0-9]{2})-([0-9]{4})-[0-9a-f]+$ ]]; then
            VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"
          else
            CREATED=$(gh release view "$TAG" --repo 2lab-ai/llmux --json createdAt -q .createdAt)
            VERSION=$(date -u -d "$CREATED" +%Y.%m.%d.%H%M)
          fi
          ASSET="LlmuxIslands-${VERSION}.zip"
          if ! gh release download "$TAG" --repo 2lab-ai/llmux --pattern "$ASSET" --output "/tmp/$ASSET" --clobber; then
            echo "release $TAG has no $ASSET yet; skipping islands preview cask bump"
            exit 0
          fi
          SHA=$(sha256sum "/tmp/$ASSET" | cut -d' ' -f1)
          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@TAG@/$TAG/g" \
              -e "s/@SHA@/$SHA/" \
              Casks/llmux-islands-preview.rb.tmpl > Casks/llmux-islands-preview.rb
          ruby -c Casks/llmux-islands-preview.rb

      - name: Commit islands preview bump
        run: |
          set -euo pipefail
          [ -f Casks/llmux-islands-preview.rb ] || { echo "no cask; nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/llmux-islands-preview.rb 2>/dev/null || true
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          TAG=$(sed -n 's|^.*releases/download/\(preview-[^/]*\)/.*$|\1|p' Casks/llmux-islands-preview.rb | head -1)
          git commit -m "llmux-islands-preview $TAG"
          git pull --rebase
          git push

  bump-dbotter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render dbotter formula from the latest stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo 2lab-ai/dbotter --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select((.isPrerelease | not) and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$TAG" ]; then
            echo "no v* stable release yet; skipping dbotter formula"
            exit 0
          fi
          VERSION="${TAG#v}"
          CURRENT=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/dbotter.rb 2>/dev/null || true)
          if [ "${CURRENT:-}" = "$VERSION" ]; then
            echo "formula already at $VERSION"
            exit 0
          fi

          declare -A SHAS
          for asset in dbotter-macos-aarch64 dbotter-macos-x86_64 dbotter-linux-aarch64 dbotter-linux-x86_64; do
            gh release download "$TAG" --repo 2lab-ai/dbotter --pattern "$asset" --output "/tmp/$asset" --clobber
            SHAS[$asset]=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
          done

          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@SHA_MACOS_AARCH64@/${SHAS[dbotter-macos-aarch64]}/" \
              -e "s/@SHA_MACOS_X86_64@/${SHAS[dbotter-macos-x86_64]}/" \
              -e "s/@SHA_LINUX_AARCH64@/${SHAS[dbotter-linux-aarch64]}/" \
              -e "s/@SHA_LINUX_X86_64@/${SHAS[dbotter-linux-x86_64]}/" \
              Formula/dbotter.rb.tmpl > Formula/dbotter.rb

          ruby -c Formula/dbotter.rb

      - name: Commit dbotter bump
        run: |
          set -euo pipefail
          [ -f Formula/dbotter.rb ] || { echo "no stable formula; nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dbotter.rb
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          VERSION=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/dbotter.rb)
          git commit -m "dbotter $VERSION"
          git pull --rebase
          git push

  bump-dbotter-preview:
    runs-on: ubuntu-latest
    needs: bump-dbotter
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Render dbotter-preview formula from the latest prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh release list --repo 2lab-ai/dbotter --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | test("^preview-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9a-f]{12}$")))] | sort_by(.createdAt) | last | .tagName // empty')
          if [ -z "$TAG" ]; then
            echo "no preview prerelease yet; skipping dbotter-preview formula"
            exit 0
          fi
          CURRENT=$(sed -n 's|^.*releases/download/\(preview-[^/]*\)/.*$|\1|p' Formula/dbotter-preview.rb 2>/dev/null | head -1 || true)
          if [ "${CURRENT:-}" = "$TAG" ]; then
            echo "preview formula already at $TAG"
            exit 0
          fi
          if [[ ! "$TAG" =~ ^preview-([0-9]{4})-([0-9]{2})-([0-9]{2})-([0-9]{4})-[0-9a-f]{12}$ ]]; then
            echo "unsupported preview tag: $TAG" >&2
            exit 1
          fi
          VERSION="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}.${BASH_REMATCH[4]}"

          declare -A SHAS
          for asset in dbotter-macos-aarch64 dbotter-macos-x86_64 dbotter-linux-aarch64 dbotter-linux-x86_64; do
            gh release download "$TAG" --repo 2lab-ai/dbotter --pattern "$asset" --output "/tmp/$asset" --clobber
            SHAS[$asset]=$(sha256sum "/tmp/$asset" | cut -d' ' -f1)
          done

          sed -e "s/@VERSION@/$VERSION/g" \
              -e "s/@TAG@/$TAG/g" \
              -e "s/@SHA_MACOS_AARCH64@/${SHAS[dbotter-macos-aarch64]}/" \
              -e "s/@SHA_MACOS_X86_64@/${SHAS[dbotter-macos-x86_64]}/" \
              -e "s/@SHA_LINUX_AARCH64@/${SHAS[dbotter-linux-aarch64]}/" \
              -e "s/@SHA_LINUX_X86_64@/${SHAS[dbotter-linux-x86_64]}/" \
              Formula/dbotter-preview.rb.tmpl > Formula/dbotter-preview.rb

          ruby -c Formula/dbotter-preview.rb

      - name: Commit dbotter preview bump
        run: |
          set -euo pipefail
          [ -f Formula/dbotter-preview.rb ] || { echo "no preview formula; nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/dbotter-preview.rb
          git diff --cached --quiet && { echo "nothing to commit"; exit 0; }
          TAG=$(sed -n 's|^.*releases/download/\(preview-[^/]*\)/.*$|\1|p' Formula/dbotter-preview.rb | head -1)
          git commit -m "dbotter-preview $TAG"
          git pull --rebase
          git push

# registered: herdr-mx formula auto-bump
# registered: llmux formula auto-bump (preview; stable added when a v* release exists)
# registered: llmux-islands cask auto-bump (rides the llmux stable release)
# registered: llmux-islands-preview cask auto-bump (rides the llmux preview prerelease)
# registered: dbotter formula auto-bump (preview; stable added when a v* release exists)
